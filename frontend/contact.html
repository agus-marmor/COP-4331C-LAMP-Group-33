<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Contacts | Group 33 Contacts App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/contacts.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            readCookie();

            // Put your name and initials on the account menu button.
            // (readCookie() has already filled in firstName and lastName.)
            document.getElementById('accountName').textContent = firstName + ' ' + lastName;
            // On phones only the initials show, so give screen readers the full label
            document.getElementById('accountMenuButton').setAttribute('aria-label',
                'Account menu for ' + firstName + ' ' + lastName);
            document.getElementById('accountInitials').textContent =
                (firstName.charAt(0) + lastName.charAt(0)).toUpperCase();

            // Every time the Change Password popup opens, clear it out.
            // Passwords should never still be sitting in the boxes from last time.
            document.getElementById('changePasswordModal').addEventListener('show.bs.modal', function () {
                document.getElementById('changePasswordForm').reset();
                let resultEl = document.getElementById('changePasswordResult');
                resultEl.innerHTML = '';
                resultEl.className = 'small fw-semibold';
            });

            // Every time the Add Contact popup opens, start fresh:
            // empty boxes and no leftover message from last time.
            document.getElementById('addContactModal').addEventListener('show.bs.modal', function () {
                document.getElementById('addContactForm').reset();
                let resultEl = document.getElementById('contactAddResult');
                resultEl.innerHTML = '';
                resultEl.className = 'small fw-semibold';
            });
        }, false);
    </script>
</head>

<body class="contacts-page">
    <div class="contacts-atmosphere" aria-hidden="true">
        <div class="contacts-grid"></div>
    </div>

    <main class="contacts-shell">
        <!-- Header: logo + title on the left, logged-in user + logout on the right -->
        <header class="contacts-header">
            <div class="contacts-brand">
                <div class="contacts-mark" aria-hidden="true">
                    <i class="bi bi-person-lines-fill"></i>
                </div>
                <div>
                    <h1 id="title">Contacts</h1>
                </div>
            </div>

            <!-- Account menu: click your name to open a small dropdown.
                 Bootstrap does the opening/closing because of data-bs-toggle="dropdown". -->
            <div id="loggedInDiv" class="dropdown account-menu">
                <button type="button" id="accountMenuButton" class="user-pill dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="accountInitials" class="account-avatar" aria-hidden="true"></span>
                    <span id="accountName"></span>
                </button>

                <!-- dropdown-menu-end lines the menu up with the right edge of the button -->
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountMenuButton">
                    <li>
                        <button type="button" class="dropdown-item" data-bs-toggle="modal"
                            data-bs-target="#changePasswordModal">
                            <i class="bi bi-key"></i> Change password
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button type="button" id="logoutButton" class="dropdown-item item-logout" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right"></i> Log out
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <!-- Main panel -->
        <section id="accessUIDiv" class="contacts-panel glass-card">
            <!-- Title + count on the left, Add contact on the right -->
            <div class="panel-heading">
                <div>
                    <h2 class="panel-title">Your contacts</h2>
                    <span id="contactSearchResult" aria-live="polite"></span>
                </div>
                <button type="button" id="addContactButton" aria-label="Add contact"
                    class="buttons btn btn-primary d-flex align-items-center justify-content-center gap-2"
                    data-bs-toggle="modal" data-bs-target="#addContactModal">
                    <i class="bi bi-person-plus"></i>
                    <span>Add contact</span>
                </button>
            </div>

            <!-- Search gets its own full-width row so nothing next to it looks like a search button -->
            <div class="search-row">
                <label for="searchText" class="visually-hidden">Search contacts</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <!-- oninput runs every time the text changes (typing, deleting, or clicking the X).
                         searchAsYouType() waits until you pause typing, then searches.
                         Enter and the Search button still search right away. -->
                    <input type="search" id="searchText" class="form-control" placeholder="Search contacts…"
                        autocomplete="off"
                        onkeyup="if (event.key === 'Enter') searchContact();"
                        oninput="searchAsYouType();" />
                    <button type="button" id="searchContactButton" class="btn btn-search" onclick="searchContact();">
                        Search
                    </button>
                </div>
            </div>

            <div id="contactList"></div>
        </section>
    </main>

    <!-- Modals must stay OUTSIDE .contacts-shell: its entrance animation uses a transform,
         which traps position:fixed and would leave only the grey backdrop visible -->

    <!-- Add Contact Modal -->
    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="addContactModalLabel">Add New Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addContactForm" onsubmit="event.preventDefault(); addContact();">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="contactFirstName" class="form-label form-label-contrast">First Name</label>
                                <input type="text" id="contactFirstName" class="form-control" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="contactLastName" class="form-label form-label-contrast">Last Name</label>
                                <input type="text" id="contactLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="contactEmail" class="form-label form-label-contrast">Email</label>
                            <input type="email" id="contactEmail" class="form-control" placeholder="name@example.com" required />
                        </div>
                        <div class="mb-3">
                            <label for="contactPhone" class="form-label form-label-contrast">Phone</label>
                            <input type="tel" id="contactPhone" class="form-control" placeholder="123-456-7890" />
                        </div>
                        <div class="mb-3">
                            <span id="contactAddResult" class="small fw-semibold"></span>
                        </div>
                        <button type="submit" class="buttons btn btn-primary w-100">Save Contact</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Contact Modal -->
    <div class="modal fade" id="editContactModal" tabindex="-1" aria-labelledby="editContactModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="editContactModalLabel">Edit Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editContactForm" onsubmit="event.preventDefault(); saveContactEdit();">
                        <input type="hidden" id="editContactId" />
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="editFirstName" class="form-label form-label-contrast">First Name</label>
                                <input type="text" id="editFirstName" class="form-control" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="editLastName" class="form-label form-label-contrast">Last Name</label>
                                <input type="text" id="editLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label form-label-contrast">Email</label>
                            <input type="email" id="editEmail" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="editPhone" class="form-label form-label-contrast">Phone</label>
                            <input type="tel" id="editPhone" class="form-control" />
                        </div>
                        <div class="mb-3">
                            <span id="editContactResult" class="small fw-semibold"></span>
                        </div>
                        <button type="submit" class="buttons btn btn-primary w-100 mb-2">Save Changes</button>
                        <button type="button" class="buttons btn btn-outline-danger w-100" onclick="deleteContactFromModal();">
                            <i class="bi bi-trash3 me-1"></i> Delete Contact
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- autocomplete="current-password" / "new-password" tell password managers
                         which box is which, so they can fill in or save the right one. -->
                    <form id="changePasswordForm" onsubmit="event.preventDefault(); changePassword();">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label form-label-contrast">Current Password</label>
                            <input type="password" id="currentPassword" class="form-control"
                                autocomplete="current-password" required />
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label form-label-contrast">New Password</label>
                            <input type="password" id="newPassword" class="form-control"
                                autocomplete="new-password" minlength="6" required aria-describedby="newPasswordHint" />
                            <div id="newPasswordHint" class="form-hint">At least 6 characters</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label form-label-contrast">Confirm New Password</label>
                            <input type="password" id="confirmPassword" class="form-control"
                                autocomplete="new-password" minlength="6" required />
                        </div>
                        <div class="mb-3">
                            <span id="changePasswordResult" class="small fw-semibold" aria-live="polite"></span>
                        </div>
                        <button type="submit" id="changePasswordButton" class="buttons btn btn-primary w-100">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
