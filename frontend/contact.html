<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <!--    <link rel="alternate icon" href="favicon.ico"> -->
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            readCookie();
        }, false);
    </script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-telephone"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Contacts</h1>
                    </div>
                    
                    <!-- Logged In User Info & Logout Button -->
		    <div id="idk" class="d-flex align-items-center gap-3 bg-body-tertieary px-3 py-2">

			    <div id="loggedInDiv" class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
				<span id="userName" class="small fw-medium text-body"></span>
				<button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
				    <i class="bi bi-box-arrow-right me-1"></i> Log Out
				</button>
			    </div>

                    <!-- Add Contact Button -->
			    <div id="loggedInDiv" class="d-flex align-items-center gap-3">
				<button type="button" id="addContactButton" class="buttons btn btn-primary px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#addContactModal">
					<i class="bi bi-person-add"></i> 
				</button>
			</div>
			</div>

		</div>



                <!-- Access UI Card -->
                <div id="accessUIDiv" class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2 text-white">
                            <i class="bi bi-sliders text-primary"></i> Contact Manager
                        </h2>

                        <!-- Search Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchText" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchText" class="form-control" placeholder="Type a name" onkeyup="if(event.key === 'Enter') searchContact();" />
                                <button type="button" id="searchContactButton" class="buttons btn btn-primary px-4 fw-semibold" onclick="searchContact();">
                                    Search Contact
                                </button>
                            </div>
                            <div class="mt-3">
                                <span id="contactSearchResult" class="text-info-wcag small fw-semibold"></span>
                                <div id="contactList" class="mt-2 mb-0 d-flex flex-wrap gap-2"></div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
        <!-- Edit Contact Modal -->
        <div class="modal fade" id="editContactModal" tabindex="-1" aria-labelledby="editContactModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content glass-card">
            <div class="modal-header">
                <h5 class="modal-title" id="editContactModalLabel">Edit Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editContactForm" onsubmit="event.preventDefault(); saveContactEdit();">
                <input type="hidden" id="editContactId" />
                <div class="mb-3">
                    <label for="editFirstName" class="form-label form-label-contrast small">First Name</label>
                    <input type="text" id="editFirstName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="editLastName" class="form-label form-label-contrast small">Last Name</label>
                    <input type="text" id="editLastName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="editEmail" class="form-label form-label-contrast small">Email</label>
                    <input type="email" id="editEmail" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="editPhone" class="form-label form-label-contrast small">Phone</label>
                    <input type="tel" id="editPhone" class="form-control" />
                </div>
                <div class="mb-3">
                    <span id="editContactResult" class="small fw-semibold"></span>
                </div>
                <button type="submit" class="buttons btn btn-primary w-100 fw-semibold mb-2">Save Changes</button>
                <button type="button" class="buttons btn btn-outline-danger w-100 fw-semibold" onclick="deleteContactFromModal();">
                    <i class="bi bi-trash3 me-1"></i> Delete Contact
                </button>
                </form>
            </div>
            </div>
        </div>
        </div>
                <!-- Add Contact Modal -->
        <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content glass-card">
            <div class="modal-header">
                <h5 class="modal-title" id="addContactModalLabel">Add New Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addContactForm" onsubmit="event.preventDefault(); addContact();">
                <div class="mb-3">
                    <label for="contactFirstName" class="form-label form-label-contrast small">First Name</label>
                    <input type="text" id="contactFirstName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="contactLastName" class="form-label form-label-contrast small">Last Name</label>
                    <input type="text" id="contactLastName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="contactEmail" class="form-label form-label-contrast small">Email</label>
                    <input type="email" id="contactEmail" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="contactPhone" class="form-label form-label-contrast small">Phone</label>
                    <input type="tel" id="contactPhone" class="form-control" placeholder="123-456-7890" />
                </div>
                <div class="mb-3">
                    <span id="contactAddResult" class="small fw-semibold"></span>
                </div>
                <button type="submit" class="buttons btn btn-primary w-100 fw-semibold">Save Contact</button>
                </form>
            </div>
            </div>
        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
