<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Group 33 Contacts App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/code.js"></script>
</head>

<body class="login-page d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-atmosphere" aria-hidden="true">
        <div class="login-grid"></div>
    </div>

    <main class="login-shell">
        <header class="login-brand">
            <div class="login-mark" aria-hidden="true">
                <i class="bi bi-person-lines-fill"></i>
            </div>
            <h1 id="title">Contacts Manager Web App</h1>
            <p class="login-tagline">Sign in to manage your contacts</p>
        </header>

        <div id="loginDiv" class="login-panel glass-card">
            <div class="card-body p-0">
                <span id="inner-title" class="d-block text-center mb-4">Welcome back</span>
                <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" class="needs-validation">
                    <div class="login-field">
                        <label for="loginName" class="form-label form-label-contrast">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="loginName" class="form-control" placeholder="Enter username"
                                autocomplete="username" required />
                        </div>
                    </div>
                    <div class="login-field-password">
                        <label for="loginPassword" class="form-label form-label-contrast">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter password"
                                autocomplete="current-password" required />
                        </div>
                    </div>
                    <button type="submit" id="loginButton"
                        class="buttons btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
                        <span>Sign In</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
                <div class="mt-3 text-center">
                    <span id="loginResult" class="small fw-semibold"></span>
                </div>
                <div class="login-footer">
                    <span id="secondary-inner-title">Don't have an account?</span>
                    <button type="button" id="signUpButton"
                        class="buttons btn btn-signup d-inline-flex align-items-center justify-content-center gap-1"
                        data-bs-toggle="modal" data-bs-target="#registerModal">
                        <span>Sign up</span>
                        <i class="bi bi-person-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal must be outside .login-shell: that element keeps a transform from
         its entrance animation, which traps position:fixed and leaves only the grey backdrop visible. -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Create an Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm" onsubmit="event.preventDefault(); doRegister();">
                        <div class="mb-3">
                            <label for="registerFirstName" class="form-label form-label-contrast">First Name</label>
                            <input type="text" id="registerFirstName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="registerLastName" class="form-label form-label-contrast">Last Name</label>
                            <input type="text" id="registerLastName" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="registerLogin" class="form-label form-label-contrast">Username</label>
                            <input type="text" id="registerLogin" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label form-label-contrast">Password</label>
                            <input type="password" id="registerPassword" class="form-control" required minlength="6" />
                        </div>
                        <div class="mb-3">
                            <span id="registerResult" class="small fw-semibold"></span>
                        </div>
                        <button type="submit" class="buttons btn btn-primary w-100">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
