<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Group 33 Contacts App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-lines-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Group 33 Contacts App</h1>
                    <p class="text-secondary-contrast small">Contact Manager Portal</p>
                </div>

                <!-- Login Card -->
		<div class"glass card shadow-lg border-0 p-4 p-sm5">
                <div id="loginDiv" class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">
                        <span id="inner-title" class="d-block text-center fw-semibold text-uppercase tracking-wider mb-4 fs-5">Please Log In</span>
                        
                        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" class="needs-validation">
                            <!-- Username Input Group -->
                            <div class="mb-3">
                                <label for="loginName" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="loginName" class="form-control" placeholder="Enter login" required />
                                </div>
                            </div>
                            
                            <!-- Password Input Group -->
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required />
                                </div>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" id="loginButton" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Sign In</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <!-- Feedback Result Message -->
                        <div class="mt-3 text-center">
                            <span id="loginResult" class="small fw-semibold"></span>
                        </div>

			<div class = "d-flex align-items-center justify-content-end gap-2">
				<span id = "secondary-inner-title">Don't have an account? </span>
                <button id="signUpButton" class="buttons btn btn-signup w-20 py-1 fw-semibold rounded-4 shadow-sm d-flex align-items-center justify-content-center gap-2" data-bs-toggle="modal" data-bs-target="#registerModal">
                    <span>Sign up</span>
                    <i class ="bi bi-person-up"></i>
                </button>
			</div>
                    </div>
                </div>

            </div>
        </div>
        <!-- Register Modal -->
        <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content glass-card">
            <div class="modal-header">
                <h5 class="modal-title" id="registerModalLabel">Create an Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm" onsubmit="event.preventDefault(); doRegister();">
                <div class="mb-3">
                    <label for="registerFirstName" class="form-label form-label-contrast small">First Name</label>
                    <input type="text" id="registerFirstName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="registerLastName" class="form-label form-label-contrast small">Last Name</label>
                    <input type="text" id="registerLastName" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="registerLogin" class="form-label form-label-contrast small">Username</label>
                    <input type="text" id="registerLogin" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label form-label-contrast small">Password</label>
                    <input type="password" id="registerPassword" class="form-control" required minlength="6" />
                </div>
                <div class="mb-3">
                    <span id="registerResult" class="small fw-semibold"></span>
                </div>
                <button type="submit" class="buttons btn btn-primary w-100 fw-semibold">Create Account</button>
                </form>
            </div>
            </div>
        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
