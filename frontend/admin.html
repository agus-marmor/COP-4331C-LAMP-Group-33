<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <title>Admin | Group 33 Contacts App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <!-- Reusing contacts.css directly — its component classes (.user-pill,
         .account-avatar, .btn-edit, .contact-row, etc.) aren't scoped to
         contact.html specifically, so the admin page can borrow them as-is. -->
    <link href="css/contacts.css" rel="stylesheet">
    <style>
        /* The only admin-specific additions contacts.css doesn't already have:
           role/status pills, and a slightly wider panel since a user list
           carries more per-row info (username + role + status) than a
           contact card does. Small enough to keep inline rather than a
           whole extra file. */
        main.contacts-shell.admin-shell {
            width: min(900px, calc(100% - 2rem));
        }

        .pill-row {
            display: inline-flex;
            align-items: center;
            padding: 0.12rem 0.55rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-left: 0.5rem;
        }

        .pill-role-admin { background: var(--ct-brand-soft); color: var(--ct-brand); }
        .pill-role-user  { background: rgba(20, 32, 26, 0.06); color: var(--ct-muted); }
        .pill-status-active   { background: #e9f6ec; color: #1e7a34; }
        .pill-status-disabled { background: #fbeae9; color: #b3261e; }

        .btn-edit.btn-edit-danger:hover  { background: #fbeae9; border-color: rgba(179,38,30,.25); color: #b3261e; }
        .btn-edit.btn-edit-success:hover { background: #e9f6ec; border-color: rgba(30,122,52,.25); color: #1e7a34; }
    </style>
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript" src="js/admin.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            readAdminCookie();

            document.getElementById('accountName').textContent = firstName + ' ' + lastName;
            document.getElementById('accountMenuButton').setAttribute('aria-label',
                'Account menu for ' + firstName + ' ' + lastName);
            document.getElementById('accountInitials').textContent =
                (firstName.charAt(0) + lastName.charAt(0)).toUpperCase();

            document.getElementById('changePasswordModal').addEventListener('show.bs.modal', function () {
                document.getElementById('changePasswordForm').reset();
                let resultEl = document.getElementById('passwordChangeResult');
                resultEl.innerHTML = '';
                resultEl.className = 'small fw-semibold';
            });

            document.getElementById('createAdminModal').addEventListener('show.bs.modal', function () {
                document.getElementById('createAdminForm').reset();
                let resultEl = document.getElementById('createAdminResult');
                resultEl.innerHTML = '';
                resultEl.className = 'small fw-semibold';
            });
        }, false);
    </script>
</head>

<!-- Same body class as contact.html — this is what pulls in the gradient
     background, drifting blobs, and shared component styling for free. -->
<body class="contacts-page">
    <div class="contacts-atmosphere" aria-hidden="true">
        <div class="contacts-grid"></div>
    </div>

    <main class="contacts-shell admin-shell">
        <header class="contacts-header">
            <div class="contacts-brand">
                <div class="contacts-mark" aria-hidden="true">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <div>
                    <h1 id="title">Admin</h1>
                </div>
            </div>

            <div id="loggedInDiv" class="dropdown account-menu">
                <button type="button" id="accountMenuButton" class="user-pill dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="accountInitials" class="account-avatar" aria-hidden="true"></span>
                    <span id="accountName"></span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountMenuButton">
                    <li><a class="dropdown-item" href="contact.html"><i class="bi bi-person-lines-fill"></i> My contacts</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button type="button" id="logoutButton" class="dropdown-item item-logout" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right"></i> Log out
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <section id="accessUIDiv" class="contacts-panel glass-card">
            <div class="panel-heading">
                <div>
                    <h2 class="panel-title">All users</h2>
                    <span id="userSearchResult" aria-live="polite"></span>
                </div>
                <button type="button" id="newAdminButton" aria-label="Create admin"
                    class="buttons btn btn-primary d-flex align-items-center justify-content-center gap-2"
                    data-bs-toggle="modal" data-bs-target="#createAdminModal">
                    <i class="bi bi-person-plus"></i>
                    <span>Create admin</span>
                </button>
            </div>

            <div class="search-row">
                <label for="userSearchText" class="visually-hidden">Search users</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="search" id="userSearchText" class="form-control" placeholder="Search users…"
                        autocomplete="off"
                        onkeyup="if (event.key === 'Enter') searchUsers();" />
                    <button type="button" id="searchUserButton" class="btn btn-search" onclick="searchUsers();">
                        Search
                    </button>
                </div>
            </div>

            <div id="userList"></div>
            <div id="userListEmpty" class="empty-state d-none">
                <i class="bi bi-info-circle"></i> No matching users found.
            </div>
        </section>
    </main>

    <!-- View User's Contacts Modal -->
    <div class="modal fade" id="viewContactsModal" tabindex="-1" aria-labelledby="viewContactsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewContactsModalLabel">Contacts</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="viewContactsUserId" />
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="userContactSearchText" class="form-control" placeholder="Search this user's contacts"
                            onkeyup="if(event.key === 'Enter') searchUserContacts();" />
                        <button type="button" class="buttons btn btn-primary px-3" onclick="searchUserContacts();">Search</button>
                    </div>
                    <div id="userContactList" class="d-flex flex-column gap-2"></div>
                    <div id="userContactEmpty" class="empty-state d-none">
                        <i class="bi bi-info-circle"></i> This user has no matching contacts.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm" onsubmit="event.preventDefault(); submitPasswordChange();">
                        <input type="hidden" id="passwordUserId" />
                        <p class="small mb-3" style="color: var(--ct-muted);">
                            Setting a new password for <strong id="passwordUserLabel"></strong>
                        </p>
                        <div class="mb-3">
                            <label for="newPasswordInput" class="form-label form-label-contrast">New Password</label>
                            <input type="password" id="newPasswordInput" class="form-control"
                                autocomplete="new-password" minlength="8" required aria-describedby="newPasswordHint" />
                            <div id="newPasswordHint" class="form-hint">At least 8 characters</div>
                        </div>
                        <div class="mb-3">
                            <span id="passwordChangeResult" class="small fw-semibold" aria-live="polite"></span>
                        </div>
                        <button type="submit" class="buttons btn btn-primary w-100">
                            <span id="passwordSaveSpinner" class="spinner-inline d-none"></span> Save Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Admin Modal -->
    <div class="modal fade" id="createAdminModal" tabindex="-1" aria-labelledby="createAdminModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h5 class="modal-title" id="createAdminModalLabel">Create Admin Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createAdminForm" onsubmit="event.preventDefault(); submitCreateAdmin();">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="newAdminFirstName" class="form-label form-label-contrast">First Name</label>
                                <input type="text" id="newAdminFirstName" class="form-control" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="newAdminLastName" class="form-label form-label-contrast">Last Name</label>
                                <input type="text" id="newAdminLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="newAdminLogin" class="form-label form-label-contrast">Username</label>
                            <input type="text" id="newAdminLogin" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label for="newAdminPassword" class="form-label form-label-contrast">Password</label>
                            <input type="password" id="newAdminPassword" class="form-control"
                                autocomplete="new-password" minlength="8" required aria-describedby="newAdminPasswordHint" />
                            <div id="newAdminPasswordHint" class="form-hint">At least 8 characters</div>
                        </div>
                        <div class="mb-3">
                            <span id="createAdminResult" class="small fw-semibold"></span>
                        </div>
                        <button type="submit" class="buttons btn btn-primary w-100">
                            <span id="createAdminSpinner" class="spinner-inline d-none"></span> Create Admin
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
