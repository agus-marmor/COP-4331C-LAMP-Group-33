<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Contacts App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript" src="js/admin.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            readAdminCookie();
        }, false);
    </script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Admin</h1>
                        <span class="role-pill role-admin">Administrator view</span>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                            <span id="userName" class="small fw-medium text-body"></span>
                            <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                                <i class="bi bi-box-arrow-right me-1"></i> Log Out
                            </button>
                        </div>
                        <button type="button" id="newAdminButton" class="buttons btn btn-primary px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#createAdminModal">
                            <i class="bi bi-person-plus"></i> Create Admin
                        </button>
                    </div>
                </div>

                <!-- Users Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2">
                            <i class="bi bi-people text-primary"></i> All Users
                        </h2>

                        <!-- Search Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="userSearchText" class="form-label form-label-contrast small text-uppercase">Search Users</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="userSearchText" class="form-control" placeholder="Name or username" onkeyup="if(event.key === 'Enter') searchUsers();" />
                                <button type="button" id="searchUserButton" class="buttons btn btn-primary px-4 fw-semibold" onclick="searchUsers();">
                                    Search
                                </button>
                            </div>
                            <div class="mt-2">
                                <span id="userSearchResult" class="text-info-wcag small fw-semibold"></span>
                            </div>
                        </div>

                        <!-- Users Table -->
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Username</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="userTableBody"></tbody>
                            </table>
                        </div>
                        <div id="userListEmpty" class="empty-state d-none">
                            <i class="bi bi-info-circle me-1"></i> No matching users found.
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- View User's Contacts Modal -->
        <div class="modal fade" id="viewContactsModal" tabindex="-1" aria-labelledby="viewContactsModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content glass-card">
                    <div class="modal-header">
                        <h5 class="modal-title" id="viewContactsModalLabel">Contacts</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="viewContactsUserId" />
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                            <input type="text" id="userContactSearchText" class="form-control" placeholder="Search this user's contacts" onkeyup="if(event.key === 'Enter') searchUserContacts();" />
                            <button type="button" class="buttons btn btn-primary px-3 fw-semibold" onclick="searchUserContacts();">Search</button>
                        </div>
                        <div id="userContactList" class="d-flex flex-wrap gap-2"></div>
                        <div id="userContactEmpty" class="empty-state d-none">
                            <i class="bi bi-info-circle me-1"></i> This user has no matching contacts.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Change Password Modal -->
        <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content glass-card">
                    <div class="modal-header">
                        <h5 class="modal-title" id="changePasswordModalLabel">Change Password</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="changePasswordForm" onsubmit="event.preventDefault(); submitPasswordChange();">
                            <input type="hidden" id="passwordUserId" />
                            <p class="small text-secondary-contrast mb-3">Setting a new password for <strong id="passwordUserLabel"></strong></p>
                            <div class="mb-3">
                                <label for="newPasswordInput" class="form-label form-label-contrast small">New Password (min 8 characters)</label>
                                <input type="password" id="newPasswordInput" class="form-control" minlength="8" required />
                            </div>
                            <div class="mb-3">
                                <span id="passwordChangeResult" class="small fw-semibold"></span>
                            </div>
                            <button type="submit" class="buttons btn btn-primary w-100 fw-semibold">
                                <span id="passwordSaveSpinner" class="spinner-inline d-none"></span> Save Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Admin Modal -->
        <div class="modal fade" id="createAdminModal" tabindex="-1" aria-labelledby="createAdminModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content glass-card">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createAdminModalLabel">Create Admin Account</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="createAdminForm" onsubmit="event.preventDefault(); submitCreateAdmin();">
                            <div class="mb-3">
                                <label for="newAdminFirstName" class="form-label form-label-contrast small">First Name</label>
                                <input type="text" id="newAdminFirstName" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="newAdminLastName" class="form-label form-label-contrast small">Last Name</label>
                                <input type="text" id="newAdminLastName" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="newAdminLogin" class="form-label form-label-contrast small">Username</label>
                                <input type="text" id="newAdminLogin" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="newAdminPassword" class="form-label form-label-contrast small">Password (min 8 characters)</label>
                                <input type="password" id="newAdminPassword" class="form-control" minlength="8" required />
                            </div>
                            <div class="mb-3">
                                <span id="createAdminResult" class="small fw-semibold"></span>
                            </div>
                            <button type="submit" class="buttons btn btn-primary w-100 fw-semibold">
                                <span id="createAdminSpinner" class="spinner-inline d-none"></span> Create Admin
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
