name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy API and Frontend via Rsync
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" api/ ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/html/api/
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" frontend/ ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/html/frontend/

      - name: Execute LAMP Post-Deployment Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/html/api
            sudo chown -R www-data:www-data /var/www/html/frontend
            
            sudo find /var/www/html/api /var/www/html/frontend -type d -exec chmod 755 {} \;
            sudo find /var/www/html/api /var/www/html/frontend -type f -exec chmod 644 {} \;